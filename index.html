<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Trader Journal v5.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #1a0505; --accent-color: #ff4b2b; --card-bg: rgba(255, 255, 255, 0.05); --glass-border: 1px solid rgba(255, 255, 255, 0.1); --win-color: #00e676; --loss-color: #ff1744; --wd-color: #03a9f4; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; margin: 0; padding: 20px 20px 160px 20px; min-height: 100vh; overflow-x: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: -2; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; position: relative; z-index: 10; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-color); object-fit: cover; background: #333; }
        .section { display: none; animation: fadeIn 0.4s ease; position: relative; z-index: 5; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: var(--glass-border); backdrop-filter: blur(15px); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 12px; color: white; outline: none; font-family: 'Poppins'; box-sizing: border-box; }
        textarea { min-height: 100px; resize: vertical; }
        .btn-primary { width: 100%; padding: 15px; background: var(--accent-color); border: none; color: white; font-weight: bold; border-radius: 12px; cursor: pointer; }
        .nav-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 25px; display: flex; justify-content: space-around; padding: 12px; border: 1px solid rgba(255,255,255,0.15); z-index: 999999; box-shadow: 0 15px 35px rgba(0,0,0,0.7); pointer-events: auto; }
        .nav-btn { background: none; border: none; color: #555; font-size: 20px; cursor: pointer; flex: 1; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; transition: 0.3s; padding: 10px; }
        .nav-btn.active { color: var(--accent-color); transform: translateY(-5px); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; text-align: center; border: var(--glass-border); }
        .history-item { display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: #666; cursor: pointer; padding: 5px; font-size: 16px; transition: 0.2s; }
        .del-btn:hover { color: var(--loss-color); }
        .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-color); }
        .label-small { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        .wd-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .chart-container { width: 100%; height: 180px; position: relative; }
        .ai-msg { background: rgba(3, 169, 244, 0.1); border-left: 3px solid var(--wd-color); padding: 12px; border-radius: 12px; font-size: 12px; margin-top: 10px; color: #eee; line-height: 1.5; }
        .vault-img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; margin-top: 12px; border: 1px solid #444; }
        .journal-entry { border-left: 4px solid var(--accent-color); margin-bottom: 15px; }
        .journal-category { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        .cat-mistake { background: rgba(255, 23, 68, 0.2); color: var(--loss-color); }
        .cat-lesson { background: rgba(0, 230, 118, 0.2); color: var(--win-color); }
        .cat-analysis { background: rgba(3, 169, 244, 0.2); color: var(--wd-color); }
        .cat-note { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <header>
        <div><small style="color:#ccc;">Trading Performance</small><h2 id="display-name" style="margin:0;">Trader</h2></div>
        <img src="" id="header-avatar" class="user-avatar">
    </header>

    <div id="home" class="section active">
        <div class="card" style="background: var(--accent-color); text-align: center;">
            <small>Current Equity (Net)</small>
            <h1 style="margin: 5px 0; font-size: 34px;">$ <span id="home-balance">0</span></h1>
            <div id="home-growth" style="font-size: 12px; font-weight: bold; opacity: 0.9;">Growth: 0%</div>
        </div>
        <div class="card">
            <span class="label-small"><i class="fas fa-chart-area"></i> Equity Curve</span>
            <div class="chart-container"><canvas id="equityChart"></canvas></div>
        </div>
        <div class="stat-grid">
            <div class="stat-box"><span class="label-small">Win Rate</span><div id="stat-wr" style="font-weight: 600; color: var(--win-color);">0%</div></div>
            <div class="stat-box"><span class="label-small">Days Active</span><div id="stat-days" style="font-weight: 600;">0 Days</div></div>
        </div>
        <div class="card">
            <span class="label-small"><i class="fas fa-robot"></i> AI Psychology Insights</span>
            <div id="ai-insight" class="ai-msg">Mulai catat trade lo.</div>
        </div>
        <h4 style="margin: 20px 0 10px 5px;"><i class="fas fa-money-bill-wave"></i> Recent Withdrawals</h4>
        <div id="wd-summary-list" class="card"></div>
    </div>

    <div id="trading" class="section">
        <h3>Trade Journal</h3>
        <div class="card">
            <input type="text" id="pair" placeholder="Pair (ex: BTC/USDT)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <select id="side"><option value="BUY">BUY</option><option value="SELL">SELL</option></select>
                <select id="result"><option value="win">WIN (+)</option><option value="loss">LOSS (-)</option></select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="number" id="pnl" placeholder="P&L Amount ($)">
                <input type="number" id="rr" placeholder="RR Ratio" step="0.1">
            </div>
            <label class="label-small">Feeling Entry:</label>
            <select id="emotion">
                <option value="Tenang">🧘 Tenang / Disiplin</option>
                <option value="Takut">😨 Takut / Ragu</option>
                <option value="FOMO">🚀 FOMO / Buru-buru</option>
                <option value="Marah">😡 Marah / Revenge Trade</option>
            </select>
            <input type="text" id="screenshot" placeholder="Link Gambar Chart">
            <button class="btn-primary" onclick="addTrade()">Submit Trade</button>
            <button class="btn-primary" onclick="addWithdrawal()" style="background: var(--wd-color); margin-top:10px;">Withdrawal</button>
        </div>
        <div id="trade-list"></div>
    </div>

    <div id="journal" class="section">
        <h3><i class="fas fa-book"></i> Personal Journal</h3>
        <div class="card">
            <label class="label-small">Kategori:</label>
            <select id="journal-category">
                <option value="mistake">❌ Kesalahan</option>
                <option value="lesson">✅ Pelajaran</option>
                <option value="analysis">📊 Analisis</option>
                <option value="note">📝 Catatan</option>
            </select>
            <input type="text" id="journal-title" placeholder="Judul (opsional)">
            <textarea id="journal-content" placeholder="Tulis jurnal lo di sini... Apa yang salah? Apa yang dipelajari? Analisis trade, dll."></textarea>
            <button class="btn-primary" onclick="addJournal()"><i class="fas fa-plus"></i> Tambah Journal Entry</button>
        </div>
        <h4 style="margin: 20px 0 10px 5px;">Entries</h4>
        <div id="journal-list"></div>
    </div>

    <div id="saving" class="section">
        <h3>Dream Goals</h3>
        <div class="card">
            <input type="text" id="itemName" placeholder="Nama Barang">
            <input type="text" id="itemImage" placeholder="URL Gambar">
            <input type="number" id="itemPrice" placeholder="Harga ($)">
            <button class="btn-primary" onclick="addItem()">Tambah Target</button>
        </div>
        <div id="dream-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="settings" class="section">
        <h3>Settings</h3>
        <div class="card" style="text-align: center;">
            <img src="" id="preview-avatar" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent-color); object-fit: cover;">
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)" style="display:none;">
            <br><button onclick="document.getElementById('file-input').click()" style="background:none; border:1px solid var(--accent-color); color:var(--accent-color); padding:5px 12px; border-radius:8px; font-size:12px; margin: 10px 0 20px 0;">Ganti Foto</button>
            
            <input type="text" id="input-name" placeholder="Nama">
            <input type="number" id="input-capital" placeholder="Modal Awal ($)">
            
            <div style="text-align: left;">
                <label class="label-small">Warna Aksen</label>
                <input type="color" id="color-accent" onchange="updateTheme()" style="height: 45px; width: 100%; border-radius: 12px; margin-bottom: 15px;">
                
                <label class="label-small">Wallpaper Galeri</label>
                <input type="file" id="bg-input" accept="image/*" onchange="previewBg(event)" style="display:none;">
                <button onclick="document.getElementById('bg-input').click()" style="width:100%; padding:12px; background:rgba(255,255,255,0.1); border:1px solid #444; border-radius:12px; color:white; font-family:'Poppins'; margin-bottom:15px;"><i class="fas fa-image"></i> Pilih Wallpaper</button>
            </div>

            <button class="btn-primary" onclick="saveProfile()">Simpan Perubahan</button>
            <button onclick="clearAllData()" style="background:none; border:none; color:var(--loss-color); font-size:11px; margin-top:20px;">Reset Semua</button>
        </div>
    </div>

    <nav class="nav-container">
        <button class="nav-btn active" onclick="showTab('home', this)"><i class="fas fa-home"></i></button>
        <button class="nav-btn" onclick="showTab('trading', this)"><i class="fas fa-chart-line"></i></button>
        <button class="nav-btn" onclick="showTab('journal', this)"><i class="fas fa-book"></i></button>
        <button class="nav-btn" onclick="showTab('saving', this)"><i class="fas fa-wallet"></i></button>
        <button class="nav-btn" onclick="showTab('settings', this)"><i class="fas fa-cog"></i></button>
    </nav>

    <script>
        let trades = JSON.parse(localStorage.getItem('trades')) || [];
        let items = JSON.parse(localStorage.getItem('dreamItems')) || [];
        let withdrawals = JSON.parse(localStorage.getItem('withdrawals')) || [];
        let journals = JSON.parse(localStorage.getItem('journals')) || [];
        let config = JSON.parse(localStorage.getItem('traderConfig')) || { name: "Trader", capital: 0, accent: "#ff4b2b", bgData: "", profilePic: "https://ui-avatars.com/api/?name=User" };
        let myChart;

        window.onload = () => { applyTheme(); loadFields(); updateUI(); };

        function showTab(tabName, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
            window.scrollTo(0,0);
        }

        function applyTheme() {
            document.documentElement.style.setProperty('--accent-color', config.accent);
            document.body.style.backgroundImage = config.bgData ? `url('${config.bgData}')` : 'none';
            document.getElementById('header-avatar').src = config.profilePic;
            document.getElementById('preview-avatar').src = config.profilePic;
            document.getElementById('display-name').innerText = config.name;
        }

        function updateTheme() { config.accent = document.getElementById('color-accent').value; applyTheme(); }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = () => { config.profilePic = reader.result; document.getElementById('preview-avatar').src = reader.result; };
            reader.readAsDataURL(event.target.files[0]);
        }

        function previewBg(event) {
            const reader = new FileReader();
            reader.onload = () => { 
                config.bgData = reader.result; 
                document.body.style.backgroundImage = `url('${reader.result}')`; 
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        function saveProfile() {
            config.name = document.getElementById('input-name').value;
            config.capital = parseFloat(document.getElementById('input-capital').value) || 0;
            config.accent = document.getElementById('color-accent').value;
            localStorage.setItem('traderConfig', JSON.stringify(config));
            applyTheme(); updateUI(); alert("Saved!");
        }

        function loadFields() {
            document.getElementById('input-name').value = config.name;
            document.getElementById('input-capital').value = config.capital;
            document.getElementById('color-accent').value = config.accent;
        }

        function addTrade() {
            const pair = document.getElementById('pair').value, pnl = parseFloat(document.getElementById('pnl').value);
            if(!pair || isNaN(pnl)) return;
            trades.unshift({ id: Date.now(), pair: pair.toUpperCase(), side: document.getElementById('side').value, result: document.getElementById('result').value, pnl, rr: document.getElementById('rr').value || "0", emotion: document.getElementById('emotion').value, ss: document.getElementById('screenshot').value, date: new Date().toISOString() });
            localStorage.setItem('trades', JSON.stringify(trades));
            updateUI();
            ['pair','pnl','rr','screenshot'].forEach(id => document.getElementById(id).value = '');
        }

        function deleteTrade(id) { if(confirm("Hapus trade?")) { trades = trades.filter(t => t.id !== id); localStorage.setItem('trades', JSON.stringify(trades)); updateUI(); } }

        function addWithdrawal() {
            const amt = parseFloat(prompt("Jumlah WD ($):"));
            if(!isNaN(amt) && amt > 0) {
                withdrawals.unshift({ id: Date.now(), amount: amt, date: new Date().toLocaleDateString() });
                localStorage.setItem('withdrawals', JSON.stringify(withdrawals));
                updateUI();
            }
        }

        function deleteWD(id) {
            if(confirm("Hapus WD dari history?")) {
                withdrawals = withdrawals.filter(w => w.id !== id);
                localStorage.setItem('withdrawals', JSON.stringify(withdrawals));
                updateUI();
            }
        }

        function addJournal() {
            const category = document.getElementById('journal-category').value;
            const title = document.getElementById('journal-title').value;
            const content = document.getElementById('journal-content').value.trim();
            
            if(!content) {
                alert("Isi konten jurnal dulu!");
                return;
            }
            
            journals.unshift({
                id: Date.now(),
                category: category,
                title: title || getCategoryName(category),
                content: content,
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                timestamp: new Date().toISOString()
            });
            
            localStorage.setItem('journals', JSON.stringify(journals));
            updateUI();
            
            document.getElementById('journal-title').value = '';
            document.getElementById('journal-content').value = '';
        }

        function getCategoryName(cat) {
            const names = {
                'mistake': 'Kesalahan',
                'lesson': 'Pelajaran',
                'analysis': 'Analisis',
                'note': 'Catatan'
            };
            return names[cat] || 'Entry';
        }

        function deleteJournal(id) {
            if(confirm("Hapus journal entry ini?")) {
                journals = journals.filter(j => j.id !== id);
                localStorage.setItem('journals', JSON.stringify(journals));
                updateUI();
            }
        }

        function renderJournals() {
            const list = document.getElementById('journal-list');
            list.innerHTML = '';
            
            if(journals.length === 0) {
                list.innerHTML = '<div class="card" style="text-align:center; color:#666;"><i class="fas fa-book-open" style="font-size:40px; margin-bottom:10px; opacity:0.3;"></i><p>Belum ada journal entry.<br>Mulai catat kesalahan & pelajaran lo!</p></div>';
                return;
            }
            
            journals.forEach(j => {
                list.innerHTML += `<div class="card journal-entry">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                        <div>
                            <span class="journal-category cat-${j.category}">${j.title}</span>
                            <div style="font-size:10px; color:#888; margin-top:4px;"><i class="fas fa-calendar-alt"></i> ${j.date}</div>
                        </div>
                        <i class="fas fa-trash-alt del-btn" onclick="deleteJournal(${j.id})"></i>
                    </div>
                    <div style="font-size:13px; line-height:1.6; color:#ddd; white-space:pre-wrap;">${j.content}</div>
                </div>`;
            });
        }

        function updateUI() {
            let totalProfit = 0, winCount = 0, totalLossVal = 0;
            let emotionLoss = { FOMO: 0, Takut: 0, Marah: 0, Tenang: 0 };
            let equityHistory = [config.capital];
            
            const list = document.getElementById('trade-list'); list.innerHTML = '';
            const sortedTrades = [...trades].reverse();
            let currentEq = config.capital;
            sortedTrades.forEach(t => {
                currentEq += (t.result === 'win' ? parseFloat(t.pnl) : -parseFloat(t.pnl));
                equityHistory.push(currentEq);
            });

            trades.forEach(t => {
                const val = parseFloat(t.pnl);
                if(t.result === 'win') { totalProfit += val; winCount++; }
                else { totalProfit -= val; totalLossVal += val; emotionLoss[t.emotion]++; }
                
                list.innerHTML += `<div class="card" style="border-left: 4px solid ${t.result==='win'?'var(--win-color)':'var(--loss-color)'}">
                    <div class="history-item">
                        <div><strong style="color:${t.side==='BUY'?'var(--win-color)':'var(--loss-color)'}">${t.side}</strong> <strong>${t.pair}</strong><br><small style="color:#aaa;">RR: ${t.rr} | ${t.emotion}</small></div>
                        <div style="display:flex; align-items:center;"><span style="color:${t.result==='win'?'var(--win-color)':'var(--loss-color)'}; font-weight:bold; margin-right:10px;">${t.result==='win'?'+':'-'}$${val}</span><i class="fas fa-trash-alt del-btn" onclick="deleteTrade(${t.id})"></i></div>
                    </div>
                </div>`;
            });

            const wdList = document.getElementById('wd-summary-list');
            wdList.innerHTML = '';
            withdrawals.forEach(w => {
                wdList.innerHTML += `<div class="wd-item">
                    <span><small style="color:#888;">${w.date}</small> - <strong style="color:var(--wd-color)">$${w.amount}</strong></span>
                    <i class="fas fa-trash-alt del-btn" onclick="deleteWD(${w.id})"></i>
                </div>`;
            });
            if(withdrawals.length === 0) wdList.innerHTML = '<small style="color:#666; display:block; text-align:center;">No WD History</small>';

            const finalEq = config.capital + totalProfit - withdrawals.reduce((a,c) => a + c.amount, 0);
            document.getElementById('home-balance').innerText = finalEq.toLocaleString();
            document.getElementById('home-growth').innerText = `Growth: ${config.capital > 0 ? ((finalEq - config.capital) / config.capital * 100).toFixed(1) : 0}%`;
            document.getElementById('stat-wr').innerText = (trades.length ? Math.round((winCount/trades.length)*100) : 0) + "%";
            
            let worst = Object.keys(emotionLoss).reduce((a, b) => emotionLoss[a] > emotionLoss[b] ? a : b);
            document.getElementById('ai-insight').innerHTML = trades.length < 3 ? "Catat 3 trade." : (emotionLoss[worst] > 0 ? `AI: Loss terbanyak pas lagi **${worst}**.` : "AI: Psikologi mantap!");

            renderChart(equityHistory);
            renderItems(finalEq);
            renderJournals();
        }

        function renderChart(data) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'line', data: { labels: data.map((_, i) => i), datasets: [{ label: 'Equity', data: data, borderColor: config.accent, backgroundColor: 'rgba(255,75,43,0.1)', borderWidth: 2, tension: 0.3, fill: true, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888', font: { size: 10 } } } } } });
        }

        function addItem() {
            const name = document.getElementById('itemName').value, price = parseFloat(document.getElementById('itemPrice').value);
            if(!name || isNaN(price)) return;
            items.unshift({ id: Date.now(), name, img: document.getElementById('itemImage').value, price });
            localStorage.setItem('dreamItems', JSON.stringify(items));
            updateUI();
        }

        function renderItems(equity) {
            const list = document.getElementById('dream-list'); list.innerHTML = '';
            items.forEach(i => {
                const p = Math.min(Math.max((equity / i.price) * 100, 0), 100);
                list.innerHTML += `<div class="card" style="padding:0; overflow:hidden; position:relative;">
                    <i class="fas fa-times-circle" onclick="deleteItem(${i.id})" style="position:absolute; top:5px; right:5px; z-index:10; cursor:pointer;"></i>
                    <img src="${i.img || 'https://via.placeholder.com/150'}" style="width:100%; height:80px; object-fit:cover;">
                    <div style="padding:10px;"><small style="font-size:10px;">${i.name}</small><br><strong>$${i.price.toLocaleString()}</strong>
                    <div class="progress-container"><div class="progress-bar" style="width:${p}%; background:var(--accent-color);"></div></div></div></div>`;
            });
        }

        function deleteItem(id) { if(confirm("Hapus?")) { items = items.filter(i => i.id !== id); localStorage.setItem('dreamItems', JSON.stringify(items)); updateUI(); } }
        function clearAllData() { if(confirm("Reset semua?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
