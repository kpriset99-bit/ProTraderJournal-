<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Trader Journal v4.12</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #1a0505; --accent-color: #ff4b2b; --card-bg: rgba(255, 255, 255, 0.05); --glass-border: 1px solid rgba(255, 255, 255, 0.1); --win-color: #00e676; --loss-color: #ff1744; --wd-color: #03a9f4; }
        
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; margin: 0; padding: 20px 20px 120px 20px; min-height: 100vh; overflow-x: hidden; }
        
        /* FIX LAPISAN: Overlay dibikin paling belakang */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); z-index: -2; pointer-events: none; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; position: relative; z-index: 1; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-color); object-fit: cover; background: #333; }
        
        .section { display: none; animation: fadeIn 0.4s ease; position: relative; z-index: 1; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: var(--glass-border); backdrop-filter: blur(15px); }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 12px; color: white; outline: none; font-family: 'Poppins'; box-sizing: border-box; }
        
        .btn-primary { width: 100%; padding: 15px; background: var(--accent-color); border: none; color: white; font-weight: bold; border-radius: 12px; cursor: pointer; }
        
        /* FIX NAVIGASI: Dibikin paling depan (z-index tinggi) */
        .nav-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: rgba(15, 15, 15, 0.98); backdrop-filter: blur(25px); border-radius: 25px; display: flex; justify-content: space-around; padding: 15px; border: 1px solid rgba(255,255,255,0.2); z-index: 99999; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .nav-btn { background: none; border: none; color: #666; font-size: 24px; cursor: pointer; flex: 1; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        .nav-btn.active { color: var(--accent-color); transform: translateY(-3px); transition: 0.3s; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; text-align: center; border: var(--glass-border); }
        .history-item { display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: #666; cursor: pointer; padding: 10px; font-size: 18px; }
        .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin: 8px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-color); }
        .label-small { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .wd-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <header>
        <div><small style="color:#ccc;">Trading Performance</small><h2 id="display-name" style="margin:0;">Trader</h2></div>
        <img src="" id="header-avatar" class="user-avatar">
    </header>

    <div id="home" class="section active">
        <div class="card" style="background: var(--accent-color); text-align: center;">
            <small>Current Equity (Net)</small>
            <h1 style="margin: 5px 0; font-size: 34px;">$ <span id="home-balance">0</span></h1>
            <div id="home-growth" style="font-size: 12px; font-weight: bold; opacity: 0.9;">Growth: 0%</div>
        </div>
        <div class="stat-grid">
            <div class="stat-box"><span class="label-small">Win Rate</span><div id="stat-wr" style="font-weight: 600; color: var(--win-color);">0%</div></div>
            <div class="stat-box"><span class="label-small">Days Active</span><div id="stat-days" style="font-weight: 600;">0 Days</div></div>
            <div class="stat-box"><span class="label-small">Total Win</span><div id="stat-total-win" style="font-weight: 600; color: var(--win-color);">$0</div></div>
            <div class="stat-box"><span class="label-small">Total Loss</span><div id="stat-total-loss" style="font-weight: 600; color: var(--loss-color);">$0</div></div>
        </div>
        <h4 style="margin: 20px 0 10px 5px;"><i class="fas fa-money-bill-wave"></i> Recent Withdrawals</h4>
        <div id="wd-summary-list" class="card"></div>
    </div>

    <div id="trading" class="section">
        <h3>Journal</h3>
        <div class="card">
            <input type="text" id="pair" placeholder="Pair (ex: BTC/USDT)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <select id="side"><option value="BUY">BUY</option><option value="SELL">SELL</option></select>
                <select id="result"><option value="win">WIN (+)</option><option value="loss">LOSS (-)</option></select>
            </div>
            <input type="number" id="pnl" placeholder="P&L Amount ($)">
            <input type="number" id="rr" placeholder="RR Ratio" step="0.1">
            <button class="btn-primary" onclick="addTrade()">Submit Trade</button>
            <button class="btn-primary" onclick="addWithdrawal()" style="background: var(--wd-color); margin-top:10px;">Withdrawal</button>
        </div>
        <div id="trade-list"></div>
    </div>

    <div id="saving" class="section">
        <h3>Dream Goals</h3>
        <div class="card">
            <input type="text" id="itemName" placeholder="Nama Barang">
            <input type="text" id="itemImage" placeholder="URL Gambar">
            <input type="number" id="itemPrice" placeholder="Harga ($)">
            <button class="btn-primary" onclick="addItem()">Tambah Target</button>
        </div>
        <div id="dream-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
    </div>

    <div id="settings" class="section">
        <h3>Settings</h3>
        <div class="card" style="text-align: center;">
            <img src="" id="preview-avatar" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent-color); object-fit: cover;">
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)" style="display:none;">
            <br>
            <button onclick="document.getElementById('file-input').click()" style="background:none; border:1px solid var(--accent-color); color:var(--accent-color); padding:5px 12px; border-radius:8px; font-size:12px; margin: 10px 0 20px 0;">Ganti Foto Profil</button>
            <input type="text" id="input-name" placeholder="Nama">
            <input type="number" id="input-capital" placeholder="Modal Awal ($)">
            <div style="text-align: left;">
                <label class="label-small">Warna Aksen</label>
                <input type="color" id="color-accent" onchange="updateTheme()" style="height: 45px; width: 100%; cursor: pointer; background: rgba(0,0,0,0.4); border: 1px solid #444; border-radius: 12px; padding: 5px; margin-bottom: 10px;">
                <label class="label-small">Wallpaper Galeri</label>
                <input type="file" id="bg-input" accept="image/*" onchange="previewBg(event)" style="display:none;">
                <button onclick="document.getElementById('bg-input').click()" style="width:100%; padding:12px; background:rgba(255,255,255,0.1); border:1px solid #444; border-radius:12px; color:white; font-family:'Poppins'; margin-bottom:15px;"><i class="fas fa-image"></i> Pilih Wallpaper</button>
            </div>
            <button class="btn-primary" onclick="saveProfile()">Simpan Perubahan</button>
            <button onclick="clearAllData()" style="background:none; border:none; color:var(--loss-color); font-size:11px; margin-top:20px;">Reset Aplikasi</button>
        </div>
    </div>

    <nav class="nav-container">
        <button class="nav-btn active" onclick="showTab('home', this)"><i class="fas fa-home"></i></button>
        <button class="nav-btn" onclick="showTab('trading', this)"><i class="fas fa-chart-line"></i></button>
        <button class="nav-btn" onclick="showTab('saving', this)"><i class="fas fa-wallet"></i></button>
        <button class="nav-btn" onclick="showTab('settings', this)"><i class="fas fa-cog"></i></button>
    </nav>

    <script>
        let trades = JSON.parse(localStorage.getItem('trades')) || [];
        let items = JSON.parse(localStorage.getItem('dreamItems')) || [];
        let withdrawals = JSON.parse(localStorage.getItem('withdrawals')) || [];
        let config = JSON.parse(localStorage.getItem('traderConfig')) || { name: "Trader", capital: 0, accent: "#ff4b2b", bgData: "", profilePic: "https://ui-avatars.com/api/?name=User" };

        window.onload = () => { applyTheme(); loadFields(); updateUI(); };

        function showTab(tabName, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
            window.scrollTo(0,0);
        }

        function applyTheme() {
            document.documentElement.style.setProperty('--accent-color', config.accent);
            document.body.style.backgroundImage = config.bgData ? `url('${config.bgData}')` : 'none';
            document.getElementById('header-avatar').src = config.profilePic;
            document.getElementById('preview-avatar').src = config.profilePic;
            document.getElementById('display-name').innerText = config.name;
        }

        function updateTheme() { config.accent = document.getElementById('color-accent').value; applyTheme(); }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = () => { config.profilePic = reader.result; document.getElementById('preview-avatar').src = reader.result; };
            reader.readAsDataURL(event.target.files[0]);
        }

        function previewBg(event) {
            const reader = new FileReader();
            reader.onload = () => { config.bgData = reader.result; document.body.style.backgroundImage = `url('${reader.result}')`; };
            reader.readAsDataURL(event.target.files[0]);
        }

        function saveProfile() {
            config.name = document.getElementById('input-name').value;
            config.capital = parseFloat(document.getElementById('input-capital').value) || 0;
            config.accent = document.getElementById('color-accent').value;
            localStorage.setItem('traderConfig', JSON.stringify(config));
            applyTheme(); alert("Saved!");
        }

        function loadFields() {
            document.getElementById('input-name').value = config.name;
            document.getElementById('input-capital').value = config.capital;
            document.getElementById('color-accent').value = config.accent;
        }

        function addTrade() {
            const pair = document.getElementById('pair').value;
            const pnl = parseFloat(document.getElementById('pnl').value);
            const rr = document.getElementById('rr').value || "0";
            if(!pair || isNaN(pnl)) return;
            trades.unshift({ id: Date.now(), pair: pair.toUpperCase(), side: document.getElementById('side').value, result: document.getElementById('result').value, pnl, rr, date: new Date().toISOString() });
            localStorage.setItem('trades', JSON.stringify(trades));
            updateUI(); document.getElementById('pair').value = ''; document.getElementById('pnl').value = ''; document.getElementById('rr').value = '';
        }

        function deleteTrade(id) { if(confirm("Hapus trade ini?")) { trades = trades.filter(t => t.id !== id); localStorage.setItem('trades', JSON.stringify(trades)); updateUI(); } }

        function addWithdrawal() {
            const amt = parseFloat(prompt("Jumlah WD ($):"));
            if(!isNaN(amt) && amt > 0) { withdrawals.unshift({ id: Date.now(), amount: amt, date: new Date().toLocaleDateString() }); localStorage.setItem('withdrawals', JSON.stringify(withdrawals)); updateUI(); }
        }

        function deleteWD(id) { if(confirm("Hapus WD?")) { withdrawals = withdrawals.filter(w => w.id !== id); localStorage.setItem('withdrawals', JSON.stringify(withdrawals)); updateUI(); } }

        function updateUI() {
            let totalProfit = 0, winCount = 0, totalWinVal = 0, totalLossVal = 0;
            const list = document.getElementById('trade-list'); list.innerHTML = '';
            trades.forEach(t => {
                const val = parseFloat(t.pnl);
                if(t.result === 'win') { totalProfit += val; winCount++; totalWinVal += val; }
                else { totalProfit -= val; totalLossVal += val; }
                const sideColor = t.side === 'BUY' ? 'var(--win-color)' : 'var(--loss-color)';
                list.innerHTML += `<div class="card history-item" style="border-left: 4px solid ${t.result==='win'?'var(--win-color)':'var(--loss-color)'}">
                    <div><strong style="color:${sideColor}">${t.side}</strong> <strong>${t.pair}</strong><br><small style="color:#aaa;">RR: ${t.rr} | ${new Date(t.date).toLocaleDateString()}</small></div>
                    <div style="display:flex; align-items:center;"><span style="color:${t.result==='win'?'var(--win-color)':'var(--loss-color)'}; font-weight:bold; margin-right:10px;">${t.result==='win'?'+':'-'}$${val}</span><i class="fas fa-trash-alt del-btn" onclick="deleteTrade(${t.id})"></i></div>
                </div>`;
            });
            const equity = config.capital + totalProfit - withdrawals.reduce((a,c) => a + c.amount, 0);
            const growth = config.capital > 0 ? ((equity - config.capital) / config.capital * 100).toFixed(1) : 0;
            let daysActive = (trades.length > 0) ? Math.ceil(Math.abs(new Date() - new Date(trades[trades.length-1].date)) / (1000 * 60 * 60 * 24)) || 1 : 0;
            document.getElementById('home-balance').innerText = equity.toLocaleString();
            document.getElementById('home-growth').innerText = `Growth: ${growth}% ${growth >= 0 ? '📈' : '📉'}`;
            document.getElementById('stat-wr').innerText = (trades.length ? Math.round((winCount/trades.length)*100) : 0) + "%";
            document.getElementById('stat-days').innerText = daysActive + " Days";
            document.getElementById('stat-total-win').innerText = "$" + totalWinVal.toLocaleString();
            document.getElementById('stat-total-loss').innerText = "$" + totalLossVal.toLocaleString();
            document.getElementById('wd-summary-list').innerHTML = withdrawals.slice(0,5).map(w => `<div class="wd-item"><span>${w.date} - <strong style="color:var(--wd-color)">$${w.amount}</strong></span><i class="fas fa-trash-alt del-btn" onclick="deleteWD(${w.id})"></i></div>`).join('') || '<small style="color:#666">No WD</small>';
            renderItems(equity);
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value);
            if(!name || isNaN(price)) return;
            items.unshift({ id: Date.now(), name, img: document.getElementById('itemImage').value, price });
            localStorage.setItem('dreamItems', JSON.stringify(items));
            updateUI();
        }

        function renderItems(equity) {
            const list = document.getElementById('dream-list'); list.innerHTML = '';
            items.forEach(i => {
                const p = Math.min(Math.max((equity / i.price) * 100, 0), 100);
                list.innerHTML += `<div class="card" style="padding:0; overflow:hidden; position:relative; border:${equity>=i.price?'2px solid var(--win-color)':'var(--glass-border)'}">
                    <i class="fas fa-times-circle" onclick="deleteItem(${i.id})" style="position:absolute; top:5px; right:5px; z-index:10; cursor:pointer; color: white;"></i>
                    <img src="${i.img || 'https://via.placeholder.com/150'}" style="width:100%; height:80px; object-fit:cover;">
                    <div style="padding:10px;"><small style="font-size:10px;">${i.name}</small><br><strong>$${i.price.toLocaleString()}</strong>
                    <div class="progress-container"><div class="progress-bar" style="width:${p}%; background:var(--accent-color);"></div></div>
                    </div></div>`;
            });
        }

        function deleteItem(id) { if(confirm("Hapus?")) { items = items.filter(i => i.id !== id); localStorage.setItem('dreamItems', JSON.stringify(items)); updateUI(); } }
        function clearAllData() { if(confirm("Hapus semua?")) { localStorage.clear(); location.reload(); } }
    </script>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
}
</script>
</body>
                    </html>
